<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fundo Branco Limpo com Degradê Minimalista -->
    <linearGradient id="bgWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Azul Royal & Sapphire Vibrante -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Azul Cobalto / Cyan Elétrico -->
    <linearGradient id="accentBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Sombra Suave de Elevação (Estilo iOS / FinTech) -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>

    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Quadrada Arredondada (Squircle) Branca com Borda Fina -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgWhite)" filter="url(#softShadow)" />
  <rect x="24" y="24" width="464" height="464" rx="120" fill="none" stroke="#E2E8F0" stroke-width="4" />

  <!-- Emblema Central: Monograma 'C' de Crediário + Cartão / FinTech Moderno -->
  <g filter="url(#logoShadow)">
    <!-- Arco Dinâmico Externo 'C' -->
    <path d="M 335 145
             C 300 115, 250 110, 205 130
             C 145 156, 115 210, 115 266
             C 115 328, 152 380, 212 402
             C 260 418, 310 405, 342 372
             C 352 362, 345 344, 330 344
             C 320 344, 312 350, 304 358
             C 278 382, 240 388, 208 374
             C 166 356, 148 316, 148 266
             C 148 216, 172 176, 215 158
             C 246 145, 280 148, 306 168
             C 316 176, 330 174, 338 164
             L 344 156
             C 349 149, 342 140, 335 145 Z"
          fill="url(#blueGrad)" />

    <!-- Cartão / Chip de Crédito Geométrico -->
    <rect x="210" y="205" width="138" height="96" rx="18" fill="url(#blueGrad)" />
    
    <!-- Detalhes do Chip em Branco Translúcido -->
    <rect x="236" y="225" width="86" height="56" rx="10" fill="#FFFFFF" fill-opacity="0.22" />
    <line x1="210" y1="237" x2="348" y2="237" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <line x1="210" y1="269" x2="348" y2="269" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <line x1="266" y1="205" x2="266" y2="301" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <circle cx="266" cy="253" r="10" fill="#FFFFFF" opacity="0.9" />

    <!-- Seta Ascendente de Crescimento & Lucro -->
    <path d="M 355 125 L 395 125 L 395 165 L 380 150 L 325 205 L 305 185 L 345 145 Z" fill="url(#accentBlue)" />
    <!-- Estrela / Brilho Azul Céu -->
    <polygon points="405,105 412,120 427,127 412,134 405,149 398,134 383,127 398,120" fill="#38BDF8" />
  </g>
</svg>