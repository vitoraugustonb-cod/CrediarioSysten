<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Main Vibrant Brand Gradient (Cyan to Emerald & Royal Blue) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Accent Emerald/Mint Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Inner Glow and Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Squircle Rounded Container Background -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="128" fill="none" stroke="url(#borderGrad)" stroke-width="8" opacity="0.6" />

  <!-- Ambient Glow Behind the Emblem -->
  <circle cx="256" cy="256" r="140" fill="#2563eb" opacity="0.25" filter="url(#glow)" />
  <circle cx="320" cy="300" r="100" fill="#10b981" opacity="0.2" filter="url(#glow)" />

  <!-- Stylized Modern Geometric Monogram "C" & Growth Card Motif -->
  <!-- Outer C Arc with Dynamic Taper -->
  <path d="M 340 140
           C 310 110, 260 100, 210 120
           C 150 145, 110 200, 110 265
           C 110 335, 155 390, 220 410
           C 275 425, 330 405, 360 370
           C 370 358, 362 340, 346 340
           C 336 340, 326 346, 318 354
           C 294 378, 252 388, 214 374
           C 168 358, 142 316, 142 265
           C 142 214, 172 170, 220 154
           C 255 142, 292 148, 318 168
           C 328 176, 342 176, 350 166
           L 356 158
           C 362 150, 352 138, 340 140 Z"
        fill="url(#brandGrad)" />

  <!-- Embedded Credit Chip / Geometric Hexagon Emblem inside C -->
  <rect x="220" y="210" width="140" height="96" rx="20" fill="url(#accentGrad)" opacity="0.95" />
  
  <!-- Credit Card Magnetic / Security Chip Grooves -->
  <line x1="220" y1="242" x2="360" y2="242" stroke="#0f172a" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  <line x1="220" y1="274" x2="360" y2="274" stroke="#0f172a" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  <line x1="275" y1="210" x2="275" y2="306" stroke="#0f172a" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  <circle cx="275" cy="258" r="14" fill="#0f172a" opacity="0.5" />

  <!-- Dynamic Upward Growth Arrow / Sparkle Accent -->
  <path d="M 360 120 L 410 120 L 410 170 L 390 150 L 320 220 L 290 190 L 340 140 Z" fill="url(#accentGrad)" />
  <polygon points="420,100 428,118 446,126 428,134 420,152 412,134 394,126 412,118" fill="#38bdf8" />
</svg>